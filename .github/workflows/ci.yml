name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite build)
        run: npm run build

  deploy:
    name: Trigger Deploy Hooks (Render & Vercel)
    runs-on: ubuntu-latest
    needs: build # only deploy after CI passes
    if: github.ref == 'refs/heads/main' # skip for PRs
    steps:
      - name: Invoke Render Deploy Hook
        run: curl -fSL "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      - name: Invoke Vercel Deploy Hook
        run: curl -fSL -X POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
